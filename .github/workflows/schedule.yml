name: LeetCode Daily Challenge Streak Checker

on:
  schedule:
    # GitHub Actions cron uses UTC: 16:30 UTC = 10:00 PM Asia/Kolkata (IST).
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-daily-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check and post LeetCode Daily Challenge status
        env:
          LEETCODE_USERS: ${{ secrets.LEETCODE_USERS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start
